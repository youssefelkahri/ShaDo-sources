name: Media sources health (Kage Media)

# كل أسبوع (الثلاثاء 03:41) + يدوياً: يفحص نطاقات مواقع الميديا ويتبع انتقالها.
on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check media sites
        run: node tools/media-health/health.js
      - name: Commit changes
        run: |
          git config user.name "kage-bot"
          git config user.email "kage-bot@users.noreply.github.com"
          git add kage/health.json knowledge/video/mirrors.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "media health: weekly site check"
          git pull --rebase -q
          git push
