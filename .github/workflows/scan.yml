name: Weekly extensions scan
# فحص أسبوعي لمستودعات إضافات CloudStream: انتقال المواقع، مواقع عربية جديدة، مستخرجات جديدة
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: node scripts/scan-extensions.js
      - run: node scripts/inline-recipes.js && node scripts/build-manifest.js
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add -A knowledge kits manifest.json
            git commit -m "scan: $(date +%F) — ${{ steps.scan.outputs.changes }} تغيير [skip ci]" && git push
          fi
