name: Update manifest
on:
  push:
    paths: ['sources/**', 'kits/**', 'knowledge/**', 'manifest.json']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inline-recipes.js && node scripts/build-manifest.js
      - run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add manifest.json && git commit -m "manifest: update hashes [skip ci]" && git push
          fi
