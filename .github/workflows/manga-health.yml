name: Manga sources health (Kage)

# كل أسبوع (الاثنين 03:17) + يدوياً: يتبع انتقال النطاقات، ويخفي المصادر المعطلة أسبوعين ويعيدها حين تعود.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manga-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Check and self-heal sources
        run: node tools/manga-health/health.js
      - name: Commit changes
        run: |
          git config user.name "kage-bot"
          git config user.email "kage-bot@users.noreply.github.com"
          git add manga/remote.json manga/health.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "manga health: weekly source check"
          git pull --rebase -q
          git push
